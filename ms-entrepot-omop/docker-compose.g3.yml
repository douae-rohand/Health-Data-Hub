name: hdh-g3

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - g3-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-entrepot-omop:
    build: .
    ports:
      - "8006:8006"
    env_file: .env.g3
    depends_on:
      postgres:
        condition: service_healthy

  # À décommenter quand les squelettes de ms-recherche et
  # ms-ia-complications existeront (chacun avec son Dockerfile).
  # ms-recherche:
  #   build: ../ms-recherche
  #   ports:
  #     - "8007:8007"
  #   env_file: .env.g3
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # ms-ia-complications:
  #   build: ../ms-ia-complications
  #   ports:
  #     - "8008:8008"
  #   env_file: .env.g3
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  g3-pgdata:
